[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lcf-lab"
version = "0.1.0"
description = "Reference-based batch fitting for soft X-ray L-edge spectra"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sathya Narayanan Jagadeesan"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "twine>=5"]

[project.scripts]
lcf-lab = "lcf_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcf_lab = ["web/*.html", "web/*.css", "web/*.js", "web/reference-library.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
precision = 2
